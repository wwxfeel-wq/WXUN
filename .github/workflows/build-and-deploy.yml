name: Build & Deploy to Aliyun

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  ACR_REGISTRY: crpi-2ybx9wocff19tlzj.cn-hangzhou.personal.cr.aliyuncs.com
  ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
  IMAGE_WEB: echolife-web
  IMAGE_API: echolife-api

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Meta
        id: meta
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & push echolife-web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.web
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_WEB }}:latest
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_WEB }}:${{ steps.meta.outputs.short_sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Build & push echolife-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.api
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_API }}:latest
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_API }}:${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  deploy:
    name: Deploy to Aliyun ECS
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          ACR_NAMESPACE_VALUE: ${{ secrets.ACR_NAMESPACE }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

          # Base64-encode ACR credentials for safe transport
          ACR_REGISTRY_B64=$(printf '%s' "$ACR_REGISTRY" | base64 -w0)
          ACR_NAMESPACE_B64=$(printf '%s' "$ACR_NAMESPACE_VALUE" | base64 -w0)
          ACR_USERNAME_B64=$(printf '%s' "$ACR_USERNAME" | base64 -w0)
          ACR_PASSWORD_B64=$(printf '%s' "$ACR_PASSWORD" | base64 -w0)

          echo "=== Uploading files to server ==="
          # Upload compose file, nginx config, and credentials
          printf 'ACR_REGISTRY_B64=%s\nACR_NAMESPACE_B64=%s\nACR_USERNAME_B64=%s\nACR_PASSWORD_B64=%s\n' \
            "$ACR_REGISTRY_B64" "$ACR_NAMESPACE_B64" "$ACR_USERNAME_B64" "$ACR_PASSWORD_B64" \
            > /tmp/deploy-secrets.env

          sshpass -e scp -o StrictHostKeyChecking=no \
            /tmp/deploy-secrets.env \
            docker-compose.deploy.yml \
            infra/nginx/nginx.conf \
            "${SSH_USER}@${SSH_HOST}:/tmp/"

          echo "=== Files uploaded, executing deploy ==="
          # Execute deploy — all output goes to stdout (visible in GitHub Actions logs)
          sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "${SSH_USER}@${SSH_HOST}" 'bash -s' << 'DEPLOY'
          # All output to stdout for GitHub Actions visibility
          echo "[$(date)] Deploy started"
          cd /www/wwwroot/echolife || { echo "FATAL: /www/wwwroot/echolife not found"; exit 1; }
          echo "Working dir: $(pwd)"

          # Decode ACR credentials
          . /tmp/deploy-secrets.env
          rm -f /tmp/deploy-secrets.env
          ACR_REGISTRY_VALUE=$(echo "$ACR_REGISTRY_B64" | base64 -d)
          ACR_NAMESPACE_VALUE=$(echo "$ACR_NAMESPACE_B64" | base64 -d)
          ACR_USERNAME_VALUE=$(echo "$ACR_USERNAME_B64" | base64 -d)
          ACR_PASSWORD_VALUE=$(echo "$ACR_PASSWORD_B64" | base64 -d)

          [ -z "$ACR_REGISTRY_VALUE" ] && { echo "FATAL: ACR_REGISTRY empty"; exit 1; }
          [ -z "$ACR_NAMESPACE_VALUE" ] && { echo "FATAL: ACR_NAMESPACE empty"; exit 1; }
          [ -z "$ACR_USERNAME_VALUE" ] && { echo "FATAL: ACR_USERNAME empty"; exit 1; }
          [ -z "$ACR_PASSWORD_VALUE" ] && { echo "FATAL: ACR_PASSWORD empty"; exit 1; }
          echo "ACR credentials OK: registry=$ACR_REGISTRY_VALUE namespace=$ACR_NAMESPACE_VALUE"

          # Install config files
          cp /tmp/docker-compose.deploy.yml docker-compose.deploy.yml
          mkdir -p infra/nginx
          cp /tmp/nginx.conf infra/nginx/nginx.conf
          echo "Config files installed"

          # Update .env.production
          [ ! -f .env.production ] && { echo "FATAL: .env.production not found"; exit 1; }
          sed -i "s|^ACR_REGISTRY=.*|ACR_REGISTRY=$ACR_REGISTRY_VALUE|" .env.production
          grep -q '^ACR_REGISTRY=' .env.production || echo "ACR_REGISTRY=$ACR_REGISTRY_VALUE" >> .env.production
          sed -i "s|^ACR_NAMESPACE=.*|ACR_NAMESPACE=$ACR_NAMESPACE_VALUE|" .env.production
          grep -q '^ACR_NAMESPACE=' .env.production || echo "ACR_NAMESPACE=$ACR_NAMESPACE_VALUE" >> .env.production
          grep -q '^NEXT_PUBLIC_API_URL=' .env.production || echo "NEXT_PUBLIC_API_URL=/api/v1" >> .env.production
          echo ".env.production updated"

          # Check docker compose version
          echo "Docker version: $(docker --version)"
          echo "Docker compose version: $(docker compose version 2>&1 || docker-compose version 2>&1)"

          # ACR login
          echo "$ACR_PASSWORD_VALUE" | docker login "$ACR_REGISTRY_VALUE" \
            -u "$ACR_USERNAME_VALUE" --password-stdin
          [ $? -ne 0 ] && { echo "FATAL: docker login failed"; exit 1; }
          echo "Docker login OK"

          # Pull images
          echo "Pulling images..."
          docker compose -f docker-compose.deploy.yml --env-file .env.production pull web api
          [ $? -ne 0 ] && { echo "FATAL: docker pull failed"; exit 1; }
          echo "Image pull OK"

          # Start DB/Redis
          docker compose -f docker-compose.deploy.yml --env-file .env.production up -d postgres redis
          echo "DB/Redis started"
          sleep 5

          # Restart API
          docker compose -f docker-compose.deploy.yml --env-file .env.production up -d --force-recreate api
          echo "API recreating..."

          # Wait for API health
          for i in $(seq 1 30); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' echolife-api 2>/dev/null)
            if [ "$STATUS" = "healthy" ]; then
              echo "API healthy after $((i*5))s"
              break
            fi
            [ "$i" -eq 30 ] && { echo "FATAL: API not healthy after 150s"; docker logs echolife-api --tail 50; exit 1; }
            sleep 5
          done

          # Restart Web + Nginx
          docker compose -f docker-compose.deploy.yml --env-file .env.production up -d --force-recreate web nginx
          echo "Web/Nginx started"
          sleep 5

          # HTTP health check
          curl -fsS http://localhost/api/v1/health && echo "" || echo "WARNING: HTTP health check failed"

          # Smoke test: tracking endpoint
          echo "Testing tracking endpoint..."
          curl -s -o /dev/null -w "Tracking: HTTP %{http_code}\n" -X POST http://localhost/api/v1/tracking/events \
            -H 'Content-Type: application/json' \
            -d '{"sessionId":"deploy-smoke","eventType":"page_view","pagePath":"/deploy-smoke","pageTitle":"Deploy Smoke Test"}'

          echo "Container status:"
          docker compose -f docker-compose.deploy.yml --env-file .env.production ps
          echo "[$(date)] Deploy completed"
          DEPLOY
