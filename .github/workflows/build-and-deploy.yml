name: Build & Deploy to Aliyun

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  ACR_REGISTRY: crpi-2ybx9wocff19tlzj.cn-hangzhou.personal.cr.aliyuncs.com
  ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
  IMAGE_WEB: echolife-web
  IMAGE_API: echolife-api

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      short_sha: ${{ steps.meta.outputs.short_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Meta
        id: meta
        run: |
          echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & push echolife-web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.web
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_WEB }}:latest
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_WEB }}:${{ steps.meta.outputs.short_sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Build & push echolife-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.api
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_API }}:latest
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_API }}:${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  deploy:
    name: Deploy to Aliyun ECS
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test SSH & Deploy
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

          # Verify SSH secrets
          if [ -z "$SSHPASS" ] || [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ]; then
            echo "::error::SSH secrets not set properly"
            exit 1
          fi
          echo "SSH_HOST: $SSH_HOST, SSH_USER: $SSH_USER, SSHPASS len: ${#SSHPASS}"

          # Quick SSH test
          echo "=== SSH connectivity test ==="
          sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
            "${SSH_USER}@${SSH_HOST}" 'echo SSH_OK && hostname' || {
            echo "::error::SSH connection failed!"
            exit 1
          }

          # Deploy script — ${{ secrets.* }} expanded by GitHub Actions before shell runs
          # Single-quoted heredoc prevents shell expansion; GHA expansion still happens
          cat > /tmp/deploy.sh << 'DEPLOY_SCRIPT'
          set -x

          cd /www/wwwroot/echolife || { echo "FATAL: dir not found"; exit 1; }

          # Sync compose file
          curl -sL --max-time 30 -H "Accept: application/vnd.github.v3.raw" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/wwxfeel-wq/WXUN/contents/docker-compose.deploy.yml?ref=main" \
            -o docker-compose.deploy.yml.new || \
          curl -sL --max-time 30 https://raw.githubusercontent.com/wwxfeel-wq/WXUN/main/docker-compose.deploy.yml \
            -o docker-compose.deploy.yml.new || true
          [ -s docker-compose.deploy.yml.new ] && mv docker-compose.deploy.yml.new docker-compose.deploy.yml || rm -f docker-compose.deploy.yml.new

          # Sync nginx config
          mkdir -p infra/nginx
          curl -sL --max-time 30 -H "Accept: application/vnd.github.v3.raw" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/wwxfeel-wq/WXUN/contents/infra/nginx/nginx.conf?ref=main" \
            -o infra/nginx/nginx.conf || \
          curl -sL --max-time 30 https://raw.githubusercontent.com/wwxfeel-wq/WXUN/main/infra/nginx/nginx.conf \
            -o infra/nginx/nginx.conf || true

          # Check .env.production
          [ ! -f .env.production ] && { echo "FATAL: .env.production not found"; exit 1; }

          # Update secrets in .env.production
          sed -i 's|^DEEPSEEK_API_KEY=.*|DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}|' .env.production 2>/dev/null || echo "DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}" >> .env.production
          grep -q '^AI_ACTIVE_PROVIDER=' .env.production || echo 'AI_ACTIVE_PROVIDER=deepseek' >> .env.production
          grep -q '^DEEPSEEK_API_URL=' .env.production || echo 'DEEPSEEK_API_URL=https://api.deepseek.com/v1' >> .env.production
          sed -i 's|^WECHAT_BOT_TOKEN=.*|WECHAT_BOT_TOKEN=${{ secrets.WECHAT_BOT_TOKEN }}|' .env.production 2>/dev/null || echo "WECHAT_BOT_TOKEN=${{ secrets.WECHAT_BOT_TOKEN }}" >> .env.production
          grep -q '^PUPPETEER_EXECUTABLE_PATH=' .env.production || echo 'PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium' >> .env.production
          grep -q '^PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=' .env.production || echo 'PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true' >> .env.production
          sed -i 's|^OPENCLAW_WEBHOOK_SECRET=.*|OPENCLAW_WEBHOOK_SECRET=${{ secrets.OPENCLAW_WEBHOOK_SECRET }}|' .env.production 2>/dev/null || echo "OPENCLAW_WEBHOOK_SECRET=${{ secrets.OPENCLAW_WEBHOOK_SECRET }}" >> .env.production
          grep -q '^ACR_REGISTRY=' .env.production || echo 'ACR_REGISTRY=${{ env.ACR_REGISTRY }}' >> .env.production
          grep -q '^ACR_NAMESPACE=' .env.production || echo 'ACR_NAMESPACE=${{ secrets.ACR_NAMESPACE }}' >> .env.production
          grep -q '^NEXT_PUBLIC_API_URL=' .env.production || echo 'NEXT_PUBLIC_API_URL=/api/v1' >> .env.production

          # ACR login — use GHA-expanded secrets directly
          echo '${{ secrets.ACR_PASSWORD }}' | docker login '${{ env.ACR_REGISTRY }}' \
            -u '${{ secrets.ACR_USERNAME }}' --password-stdin
          [ $? -ne 0 ] && { echo "FATAL: ACR login failed"; exit 1; }
          echo "ACR login OK"

          # Pull new images
          docker compose -f docker-compose.deploy.yml --env-file .env.production pull web api
          [ $? -ne 0 ] && { echo "FATAL: image pull failed"; exit 1; }
          echo "Image pull OK"

          # Restart services
          docker compose -f docker-compose.deploy.yml --env-file .env.production up -d postgres redis
          sleep 5
          docker compose -f docker-compose.deploy.yml --env-file .env.production up -d --force-recreate api
          sleep 10
          docker compose -f docker-compose.deploy.yml --env-file .env.production up -d --force-recreate web
          docker compose -f docker-compose.deploy.yml --env-file .env.production up -d --force-recreate nginx
          sleep 3

          # Health check
          for i in $(seq 1 6); do
            curl -sf http://localhost/api/v1/health && break
            sleep 5
          done

          # Diagnostics
          docker compose -f docker-compose.deploy.yml --env-file .env.production ps 2>&1 | tee /tmp/deploy_diag.txt
          docker logs echolife-api --tail 20 2>&1 | tee -a /tmp/deploy_diag.txt
          docker ps -a 2>&1 | tee -a /tmp/deploy_diag.txt
          echo "DEPLOY DONE" | tee -a /tmp/deploy_diag.txt
          DEPLOY_SCRIPT

          echo "=== Running deploy ==="
          sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 \
            "${SSH_USER}@${SSH_HOST}" 'bash -s' < /tmp/deploy.sh
          exit $?

      - name: Download diagnostic
        if: always()
        continue-on-error: true
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sudo apt-get install -y -qq sshpass
          sshpass -e scp -o StrictHostKeyChecking=no \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/deploy_diag.txt" \
            deploy_diag.txt || echo "No diagnostic file"

      - name: Upload diagnostic artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: deploy-diagnostic
          path: deploy_diag.txt
          retention-days: 7
          if-no-files-found: ignore
