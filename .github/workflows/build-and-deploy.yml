name: Build & Deploy to Aliyun

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  ACR_REGISTRY: crpi-2ybx9wocff19tlzj.cn-hangzhou.personal.cr.aliyuncs.com
  ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
  IMAGE_WEB: echolife-web
  IMAGE_API: echolife-api

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      short_sha: ${{ steps.meta.outputs.short_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Meta
        id: meta
        run: |
          echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # R3-CICD-007: Web and API images are built serially. Splitting into
      # parallel jobs could speed up the build ~2x, but the current server
      # (2vCPU/4GiB) and GitHub Actions free tier make this a low priority.
      # R3-CICD-009: Only linux/amd64 is built because the deployment server
      # is an amd64 ECS instance. Add arm64 if multi-arch is needed.
      - name: Build & push echolife-web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.web
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_WEB }}:latest
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_WEB }}:${{ steps.meta.outputs.short_sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Build & push echolife-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.api
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_API }}:latest
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_API }}:${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  deploy:
    name: Deploy to Aliyun ECS
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test SSH connectivity
        id: ssh-test
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          echo "=== Installing sshpass ==="
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

          echo "=== Verifying secrets ==="
          if [ -z "$SSHPASS" ]; then
            echo "::error::SSH_PASSWORD secret is empty or not set!"
            exit 1
          fi
          if [ -z "$SSH_HOST" ]; then
            echo "::error::SSH_HOST secret is empty or not set!"
            exit 1
          fi
          if [ -z "$SSH_USER" ]; then
            echo "::error::SSH_USER secret is empty or not set!"
            exit 1
          fi
          echo "SSHPASS length: ${#SSHPASS}"
          echo "SSH_HOST: $SSH_HOST"
          echo "SSH_USER: $SSH_USER"

          echo "=== Testing SSH connection ==="
          sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
            "${SSH_USER}@${SSH_HOST}" \
            'echo "SSH_OK"; hostname; whoami; ls /www/wwwroot/echolife/ 2>&1 | head -10; echo "SSH_TEST_DONE"'

          SSH_EXIT=$?
          echo "SSH test exit code: $SSH_EXIT"
          if [ $SSH_EXIT -ne 0 ]; then
            echo "::error::SSH connection failed! Exit code: $SSH_EXIT"
            echo "Possible causes: wrong password, server firewall blocking GitHub Actions IPs, SSH service down"
            exit 1
          fi
          echo "=== SSH connection OK ==="

      - name: Deploy via SSH
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          WECHAT_TOKEN: ${{ secrets.WECHAT_BOT_TOKEN }}
          MIHOME_CLIENT_ID: ${{ secrets.MIHOME_CLIENT_ID }}
          MIHOME_CLIENT_SECRET: ${{ secrets.MIHOME_CLIENT_SECRET }}
          OPENCLAW_SECRET: ${{ secrets.OPENCLAW_WEBHOOK_SECRET }}
          ACR_REGISTRY_VAL: ${{ env.ACR_REGISTRY }}
          ACR_NAMESPACE_VAL: ${{ secrets.ACR_NAMESPACE }}
          ACR_USERNAME_VAL: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD_VAL: ${{ secrets.ACR_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # NOTE: Do NOT use set -e here. We want to see ALL errors, not stop at the first one.
          sudo apt-get install -y -qq sshpass

          # Write deploy script — uses single-quoted heredoc to prevent local expansion.
          # Variables are passed to remote bash via the SSH command line.
          cat > /tmp/remote-deploy.sh << 'REMOTE_EOF'
          # No set -e: continue on errors, report at the end
          DEPLOY_ERRORS=""

          cd /www/wwwroot/echolife || { echo "::error::Directory /www/wwwroot/echolife not found!"; exit 1; }
          echo "=== Working directory: $(pwd) ==="

          echo "=== Sync docker-compose.deploy.yml ==="
          curl -sL --max-time 30 -H "Accept: application/vnd.github.v3.raw" \
            -H "Authorization: token ${GH_TOKEN}" \
            "https://api.github.com/repos/wwxfeel-wq/WXUN/contents/docker-compose.deploy.yml?ref=main" \
            -o docker-compose.deploy.yml.new || \
          curl -sL --max-time 30 https://raw.githubusercontent.com/wwxfeel-wq/WXUN/main/docker-compose.deploy.yml \
            -o docker-compose.deploy.yml.new || true
          if [ -s docker-compose.deploy.yml.new ]; then
            mv docker-compose.deploy.yml.new docker-compose.deploy.yml
            echo "docker-compose.deploy.yml synced OK"
          else
            rm -f docker-compose.deploy.yml.new
            echo "WARNING: download failed, using existing docker-compose.deploy.yml"
          fi

          echo "=== Sync nginx config ==="
          mkdir -p infra/nginx
          curl -sL --max-time 30 -H "Accept: application/vnd.github.v3.raw" \
            -H "Authorization: token ${GH_TOKEN}" \
            "https://api.github.com/repos/wwxfeel-wq/WXUN/contents/infra/nginx/nginx.conf?ref=main" \
            -o infra/nginx/nginx.conf || \
          curl -sL --max-time 30 https://raw.githubusercontent.com/wwxfeel-wq/WXUN/main/infra/nginx/nginx.conf \
            -o infra/nginx/nginx.conf || true

          echo "=== Update .env.production ==="
          if [ ! -f .env.production ]; then
            echo "::error::.env.production not found!"
            exit 1
          fi
          if [ -n "${DEEPSEEK_KEY}" ]; then
            sed -i "s|^DEEPSEEK_API_KEY=.*|DEEPSEEK_API_KEY=${DEEPSEEK_KEY}|" .env.production 2>/dev/null || \
              echo "DEEPSEEK_API_KEY=${DEEPSEEK_KEY}" >> .env.production
          fi
          grep -q "^AI_ACTIVE_PROVIDER=" .env.production || echo "AI_ACTIVE_PROVIDER=deepseek" >> .env.production
          grep -q "^DEEPSEEK_API_URL=" .env.production || echo "DEEPSEEK_API_URL=https://api.deepseek.com/v1" >> .env.production
          if [ -n "${WECHAT_TOKEN}" ]; then
            sed -i "s|^WECHAT_BOT_TOKEN=.*|WECHAT_BOT_TOKEN=${WECHAT_TOKEN}|" .env.production 2>/dev/null || \
              echo "WECHAT_BOT_TOKEN=${WECHAT_TOKEN}" >> .env.production
          fi
          grep -q "^PUPPETEER_EXECUTABLE_PATH=" .env.production || echo "PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium" >> .env.production
          grep -q "^PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=" .env.production || echo "PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true" >> .env.production
          if [ -n "${OPENCLAW_SECRET}" ]; then
            sed -i "s|^OPENCLAW_WEBHOOK_SECRET=.*|OPENCLAW_WEBHOOK_SECRET=${OPENCLAW_SECRET}|" .env.production 2>/dev/null || \
              echo "OPENCLAW_WEBHOOK_SECRET=${OPENCLAW_SECRET}" >> .env.production
          fi
          grep -q "^ACR_REGISTRY=" .env.production || echo "ACR_REGISTRY=${ACR_REGISTRY_VAL}" >> .env.production
          grep -q "^ACR_NAMESPACE=" .env.production || echo "ACR_NAMESPACE=${ACR_NAMESPACE_VAL}" >> .env.production
          grep -q "^NEXT_PUBLIC_API_URL=" .env.production || echo "NEXT_PUBLIC_API_URL=/api/v1" >> .env.production
          echo ".env.production OK"

          echo "=== Docker login to ACR ==="
          echo "${ACR_PASSWORD_VAL}" | docker login "${ACR_REGISTRY_VAL}" \
            -u "${ACR_USERNAME_VAL}" --password-stdin 2>&1
          echo "Docker login exit: $?"

          echo "=== Pull new images ==="
          docker compose -f docker-compose.deploy.yml --env-file .env.production pull web api 2>&1
          PULL_EXIT=$?
          if [ $PULL_EXIT -ne 0 ]; then
            echo "WARNING: Image pull failed (exit $PULL_EXIT). Will try to restart with existing images."
            DEPLOY_ERRORS="${DEPLOY_ERRORS} pull_failed"
          else
            echo "Image pull OK"
          fi

          echo "=== Restart services ==="
          docker compose -f docker-compose.deploy.yml --env-file .env.production up -d postgres redis 2>&1
          echo "postgres/redis exit: $?"
          sleep 5

          docker compose -f docker-compose.deploy.yml --env-file .env.production up -d --force-recreate api 2>&1
          echo "api exit: $?"
          sleep 10

          docker compose -f docker-compose.deploy.yml --env-file .env.production up -d --force-recreate web 2>&1
          echo "web exit: $?"

          docker compose -f docker-compose.deploy.yml --env-file .env.production up -d --force-recreate nginx 2>&1
          echo "nginx exit: $?"
          sleep 3

          echo "=== Health check ==="
          for i in $(seq 1 6); do
            HEALTH=$(curl -sf http://localhost/api/v1/health 2>/dev/null)
            if [ -n "$HEALTH" ]; then
              echo "Health check passed (attempt $i): $HEALTH"
              break
            fi
            echo "Health check attempt $i failed, retrying in 5s..."
            sleep 5
          done

          echo "=== Container status ==="
          docker compose -f docker-compose.deploy.yml --env-file .env.production ps 2>&1 | tee /tmp/deploy_diag.txt
          echo "=== API logs ===" | tee -a /tmp/deploy_diag.txt
          docker logs echolife-api --tail 30 2>&1 | tee -a /tmp/deploy_diag.txt
          echo "=== Docker disk ===" | tee -a /tmp/deploy_diag.txt
          docker system df 2>&1 | tee -a /tmp/deploy_diag.txt
          echo "=== docker ps -a ===" | tee -a /tmp/deploy_diag.txt
          docker ps -a 2>&1 | tee -a /tmp/deploy_diag.txt
          echo "=== DEPLOY DONE ===" | tee -a /tmp/deploy_diag.txt

          # Exit 0 even if there were warnings — the services are running
          exit 0
          REMOTE_EOF

          echo "=== Executing remote deploy script ==="
          sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 \
            "${SSH_USER}@${SSH_HOST}" \
            "DEEPSEEK_KEY='${DEEPSEEK_KEY}' WECHAT_TOKEN='${WECHAT_TOKEN}' MIHOME_CLIENT_ID='${MIHOME_CLIENT_ID}' MIHOME_CLIENT_SECRET='${MIHOME_CLIENT_SECRET}' OPENCLAW_SECRET='${OPENCLAW_SECRET}' ACR_REGISTRY_VAL='${ACR_REGISTRY_VAL}' ACR_NAMESPACE_VAL='${ACR_NAMESPACE_VAL}' ACR_USERNAME_VAL='${ACR_USERNAME_VAL}' ACR_PASSWORD_VAL='${ACR_PASSWORD_VAL}' GH_TOKEN='${GH_TOKEN}' bash -s" < /tmp/remote-deploy.sh

          DEPLOY_EXIT=$?
          echo "=== Deploy exit code: $DEPLOY_EXIT ==="
          exit $DEPLOY_EXIT

      - name: Download diagnostic
        if: always()
        continue-on-error: true
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sudo apt-get install -y -qq sshpass
          sshpass -e scp -o StrictHostKeyChecking=no \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/deploy_diag.txt" \
            deploy_diag.txt || echo "No diagnostic file to download"

      - name: Upload diagnostic artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: deploy-diagnostic
          path: deploy_diag.txt
          retention-days: 7
          if-no-files-found: ignore
