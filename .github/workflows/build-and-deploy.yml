name: Build & Deploy to Aliyun

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  ACR_REGISTRY: crpi-2ybx9wocff19tlzj.cn-hangzhou.personal.cr.aliyuncs.com
  ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
  IMAGE_WEB: echolife-web
  IMAGE_API: echolife-api

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      short_sha: ${{ steps.meta.outputs.short_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Meta
        id: meta
        run: |
          echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # R3-CICD-007: Web and API images are built serially. Splitting into
      # parallel jobs could speed up the build ~2x, but the current server
      # (2vCPU/4GiB) and GitHub Actions free tier make this a low priority.
      # R3-CICD-009: Only linux/amd64 is built because the deployment server
      # is an amd64 ECS instance. Add arm64 if multi-arch is needed.
      - name: Build & push echolife-web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.web
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_WEB }}:latest
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_WEB }}:${{ steps.meta.outputs.short_sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Build & push echolife-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.api
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_API }}:latest
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_API }}:${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  deploy:
    name: Deploy to Aliyun ECS
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # R3-CICD-002: SSH password auth is used for simplicity. For production
      # security, migrate to SSH key-based auth by replacing `password` with
      # `key: ${{ secrets.SSH_PRIVATE_KEY }}` and removing SSH_PASSWORD secret.
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          WECHAT_TOKEN: ${{ secrets.WECHAT_BOT_TOKEN }}
          MIHOME_CLIENT_ID: ${{ secrets.MIHOME_CLIENT_ID }}
          MIHOME_CLIENT_SECRET: ${{ secrets.MIHOME_CLIENT_SECRET }}
          OPENCLAW_SECRET: ${{ secrets.OPENCLAW_WEBHOOK_SECRET }}
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
          # R3-CICD-003: Pass ACR credentials through envs instead of inline ${{ }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_REGISTRY: ${{ env.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 20m
          envs: DEEPSEEK_KEY,WECHAT_TOKEN,MIHOME_CLIENT_ID,MIHOME_CLIENT_SECRET,OPENCLAW_SECRET,PUPPETEER_EXECUTABLE_PATH,ACR_PASSWORD,ACR_USERNAME,ACR_REGISTRY,ACR_NAMESPACE
          script: |
            set -x
            cd /www/wwwroot/echolife
            echo "== 同步 docker-compose.deploy.yml =="
            # R3-CICD-001: Add Authorization header to avoid GitHub API rate limits
            curl -sL --max-time 30 -H "Accept: application/vnd.github.v3.raw" \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/wwxfeel-wq/WXUN/contents/docker-compose.deploy.yml?ref=main" \
              -o docker-compose.deploy.yml.new || \
              curl -sL --max-time 30 https://raw.githubusercontent.com/wwxfeel-wq/WXUN/main/docker-compose.deploy.yml \
              -o docker-compose.deploy.yml.new
            if [ -s docker-compose.deploy.yml.new ]; then
              mv docker-compose.deploy.yml.new docker-compose.deploy.yml
              echo "docker-compose.deploy.yml synced OK"
            else
              rm -f docker-compose.deploy.yml.new
              echo "WARNING: download failed, using existing docker-compose.deploy.yml"
            fi
            # 保持 service_healthy 条件不变，确保依赖容器健康后才启动（R5-BUG-002 修复）
            # sed -i 's/condition: service_healthy/condition: service_started/g' docker-compose.deploy.yml
            # echo "Patched service_healthy -> service_started"
            echo "== 同步 nginx 配置 =="
            # R3-CICD-001: Add Authorization header to avoid GitHub API rate limits
            curl -sL --max-time 30 -H "Accept: application/vnd.github.v3.raw" \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/wwxfeel-wq/WXUN/contents/infra/nginx/nginx.conf?ref=main" \
              -o infra/nginx/nginx.conf || \
              curl -sL --max-time 30 https://raw.githubusercontent.com/wwxfeel-wq/WXUN/main/infra/nginx/nginx.conf \
              -o infra/nginx/nginx.conf
            if grep -q "Strict-Transport-Security" infra/nginx/nginx.conf; then
              echo "NOTE: HSTS header detected in nginx.conf (expected if HTTPS is enabled)"
            fi
            echo "== 确保 DeepSeek API 配置 =="
            if [ -n "$DEEPSEEK_KEY" ]; then
              if grep -q "^DEEPSEEK_API_KEY=" .env.production; then
                sed -i "s|^DEEPSEEK_API_KEY=.*|DEEPSEEK_API_KEY=$DEEPSEEK_KEY|" .env.production
              else
                echo "DEEPSEEK_API_KEY=$DEEPSEEK_KEY" >> .env.production
              fi
            fi
            if grep -q "^AI_ACTIVE_PROVIDER=" .env.production; then
              sed -i "s|^AI_ACTIVE_PROVIDER=.*|AI_ACTIVE_PROVIDER=deepseek|" .env.production
            else
              echo "AI_ACTIVE_PROVIDER=deepseek" >> .env.production
            fi
            if grep -q "^DEEPSEEK_API_URL=" .env.production; then
              sed -i "s|^DEEPSEEK_API_URL=.*|DEEPSEEK_API_URL=https://api.deepseek.com/v1|" .env.production
            else
              echo "DEEPSEEK_API_URL=https://api.deepseek.com/v1" >> .env.production
            fi
            echo "== 确保微信 ClawBot Token =="
            if [ -n "$WECHAT_TOKEN" ]; then
              if grep -q "^WECHAT_BOT_TOKEN=" .env.production; then
                sed -i "s|^WECHAT_BOT_TOKEN=.*|WECHAT_BOT_TOKEN=$WECHAT_TOKEN|" .env.production
              else
                echo "WECHAT_BOT_TOKEN=$WECHAT_TOKEN" >> .env.production
              fi
            fi
            echo "== 确保 IoT (米家) 配置 =="
            if [ -n "$MIHOME_CLIENT_ID" ]; then
              if grep -q "^MIHOME_CLIENT_ID=" .env.production; then
                sed -i "s|^MIHOME_CLIENT_ID=.*|MIHOME_CLIENT_ID=$MIHOME_CLIENT_ID|" .env.production
              else
                echo "MIHOME_CLIENT_ID=$MIHOME_CLIENT_ID" >> .env.production
              fi
            fi
            if [ -n "$MIHOME_CLIENT_SECRET" ]; then
              if grep -q "^MIHOME_CLIENT_SECRET=" .env.production; then
                sed -i "s|^MIHOME_CLIENT_SECRET=.*|MIHOME_CLIENT_SECRET=$MIHOME_CLIENT_SECRET|" .env.production
              else
                echo "MIHOME_CLIENT_SECRET=$MIHOME_CLIENT_SECRET" >> .env.production
              fi
            fi
            echo "== 确保 Puppeteer 截图配置 =="
            if grep -q "^PUPPETEER_EXECUTABLE_PATH=" .env.production; then
              sed -i "s|^PUPPETEER_EXECUTABLE_PATH=.*|PUPPETEER_EXECUTABLE_PATH=$PUPPETEER_EXECUTABLE_PATH|" .env.production
            else
              echo "PUPPETEER_EXECUTABLE_PATH=$PUPPETEER_EXECUTABLE_PATH" >> .env.production
            fi
            grep -q "^PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=" .env.production || echo "PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true" >> .env.production
            echo "== 确保 OpenClaw Webhook Secret =="
            if [ -n "$OPENCLAW_SECRET" ]; then
              if grep -q "^OPENCLAW_WEBHOOK_SECRET=" .env.production; then
                sed -i "s|^OPENCLAW_WEBHOOK_SECRET=.*|OPENCLAW_WEBHOOK_SECRET=$OPENCLAW_SECRET|" .env.production
              else
                echo "OPENCLAW_WEBHOOK_SECRET=$OPENCLAW_SECRET" >> .env.production
              fi
            fi
            echo "== 登录 ACR =="
            # R3-CICD-003: Use $ACR_PASSWORD from envs instead of inline ${{ secrets.ACR_PASSWORD }}
            echo "$ACR_PASSWORD" | docker login \
              "$ACR_REGISTRY" \
              -u "$ACR_USERNAME" --password-stdin
            echo "== 检查 .env.production =="
            if [ ! -f .env.production ]; then
              echo "ERROR: .env.production not found! Deployment aborted."
              echo "Please create .env.production on the server with required secrets before deploying."
              exit 1
            fi
            # R3-CICD-008: Do NOT write ACR credentials to .env.production.
            # ACR_REGISTRY and ACR_NAMESPACE are passed as shell environment
            # variables (via envs) and docker compose picks them up automatically.
            grep -q "^NEXT_PUBLIC_API_URL=" .env.production || echo "NEXT_PUBLIC_API_URL=/api/v1" >> .env.production
            echo ".env.production check OK"
            # Export ACR vars so docker compose can interpolate them
            export ACR_REGISTRY="$ACR_REGISTRY"
            export ACR_NAMESPACE="$ACR_NAMESPACE"
            echo "== 拉取新镜像 =="
            # R3-CICD-004: Fail deployment if image pull fails (was: || echo "WARNING: pull failed")
            docker compose -f docker-compose.deploy.yml --env-file .env.production pull web api || { echo "ERROR: pull failed"; exit 1; }
            # R3-CICD-005: Save current image tags for potential rollback.
            # Full automatic rollback is a future improvement. For now, record
            # the previous image digests so they can be manually restored if needed.
            docker inspect --format='{{.Config.Image}} {{.Image}}' echolife-api > /tmp/echolife-api-prev-image.txt 2>/dev/null || true
            docker inspect --format='{{.Config.Image}} {{.Image}}' echolife-web > /tmp/echolife-web-prev-image.txt 2>/dev/null || true
            echo "== 启动/重启服务（不停止现有容器）=="
            docker compose -f docker-compose.deploy.yml --env-file .env.production up -d postgres redis
            echo "postgres/redis started: $?"
            sleep 5
            docker compose -f docker-compose.deploy.yml --env-file .env.production up -d --force-recreate api
            echo "api started: $?"
            sleep 10
            docker compose -f docker-compose.deploy.yml --env-file .env.production up -d --force-recreate web
            echo "web started: $?"
            docker compose -f docker-compose.deploy.yml --env-file .env.production up -d --force-recreate nginx
            echo "nginx started: $?"
            sleep 3
            # R3-CICD-006: Health check loop after deployment
            echo "== 健康检查 =="
            for i in $(seq 1 12); do
              if curl -sf http://localhost/api/v1/health; then
                echo "Health check passed (attempt $i)"
                break
              fi
              echo "Health check attempt $i failed, retrying in 5s..."
              sleep 5
            done
            echo "== 容器状态 =="
            docker compose -f docker-compose.deploy.yml --env-file .env.production ps 2>&1 | tee /tmp/deploy_diag.txt
            echo "== API 日志（最后30行）==" | tee -a /tmp/deploy_diag.txt
            docker logs echolife-api --tail 30 2>&1 | tee -a /tmp/deploy_diag.txt
            echo "== Nginx 日志（最后20行）==" | tee -a /tmp/deploy_diag.txt
            docker logs echolife-nginx --tail 20 2>&1 | tee -a /tmp/deploy_diag.txt
            echo "== Docker 磁盘使用 ==" | tee -a /tmp/deploy_diag.txt
            docker system df 2>&1 | tee -a /tmp/deploy_diag.txt
            echo "== docker ps -a ==" | tee -a /tmp/deploy_diag.txt
            docker ps -a 2>&1 | tee -a /tmp/deploy_diag.txt
            echo "== 端口检查 ==" | tee -a /tmp/deploy_diag.txt
            ss -tlnp 2>&1 | tee -a /tmp/deploy_diag.txt
            echo "== 部署完成 ==" | tee -a /tmp/deploy_diag.txt

      - name: Download diagnostic
        continue-on-error: true
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          source: "/tmp/deploy_diag.txt"
          target: "deploy_diag.txt"
          overwrite: true

      - name: Upload diagnostic artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: deploy-diagnostic
          path: deploy_diag.txt
          retention-days: 7
          if-no-files-found: ignore
