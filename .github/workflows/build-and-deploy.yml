name: Build & Deploy to Aliyun

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  ACR_REGISTRY: crpi-2ybx9wocff19tlzj.cn-hangzhou.personal.cr.aliyuncs.com
  ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
  IMAGE_WEB: echolife-web
  IMAGE_API: echolife-api

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Meta
        id: meta
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & push echolife-web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.web
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_WEB }}:latest
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_WEB }}:${{ steps.meta.outputs.short_sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            CACHE_BUSTER=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Debug — verify source files in checkout
        run: |
          echo "=== Tracking module source files ==="
          ls -la apps/api/src/modules/tracking/ || echo "FATAL: tracking source dir missing!"
          echo "=== TrackingModule in app.module.ts ==="
          grep -n "TrackingModule" apps/api/src/app.module.ts || echo "FATAL: TrackingModule not in app.module.ts!"
          echo "=== Dockerfile.api runner stage ==="
          grep -A2 "CACHE_BUSTER" infra/docker/Dockerfile.api
          echo "=== Dockerfile.api verification steps ==="
          grep -n "tracking\|BUILD_MARKER" infra/docker/Dockerfile.api

      - name: Build & push echolife-api (no-cache to ensure tracking module is built)
        id: build_api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.api
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          no-cache: true
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_API }}:latest
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_API }}:${{ steps.meta.outputs.short_sha }}
          build-args: |
            CACHE_BUSTER=${{ github.sha }}

      - name: Debug — verify tracking module in built image
        run: |
          IMAGE="${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_API }}:${{ steps.meta.outputs.short_sha }}"
          echo "=== Checking built image: $IMAGE ==="
          # Pull the image we just pushed
          docker pull "$IMAGE" || { echo "FATAL: cannot pull image we just pushed!"; exit 1; }
          # Check tracking module exists
          docker run --rm "$IMAGE" ls -la /app/apps/api/dist/modules/tracking/ || echo "FATAL: tracking module missing in built image!"
          # Check BUILD_MARKER
          docker run --rm "$IMAGE" cat /app/apps/api/dist/BUILD_MARKER.txt || echo "FATAL: BUILD_MARKER missing in built image!"
          # Check TrackingModule in app.module.js
          docker run --rm "$IMAGE" grep -c "TrackingModule" /app/apps/api/dist/app.module.js || echo "FATAL: TrackingModule not in app.module.js!"

  deploy:
    name: Deploy to Aliyun ECS
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          ACR_NAMESPACE_VALUE: ${{ secrets.ACR_NAMESPACE }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

          SHORT_SHA=${DEPLOY_SHA:0:7}
          echo "Deploying commit $SHORT_SHA"

          # Base64-encode ACR credentials for safe transport
          ACR_REGISTRY_B64=$(printf '%s' "$ACR_REGISTRY" | base64 -w0)
          ACR_NAMESPACE_B64=$(printf '%s' "$ACR_NAMESPACE_VALUE" | base64 -w0)
          ACR_USERNAME_B64=$(printf '%s' "$ACR_USERNAME" | base64 -w0)
          ACR_PASSWORD_B64=$(printf '%s' "$ACR_PASSWORD" | base64 -w0)

          echo "=== Uploading files to server ==="
          # Upload compose file, nginx config, and credentials (including SHORT_SHA for image pull)
          printf 'ACR_REGISTRY_B64=%s\nACR_NAMESPACE_B64=%s\nACR_USERNAME_B64=%s\nACR_PASSWORD_B64=%s\nSHORT_SHA=%s\n' \
            "$ACR_REGISTRY_B64" "$ACR_NAMESPACE_B64" "$ACR_USERNAME_B64" "$ACR_PASSWORD_B64" "$SHORT_SHA" \
            > /tmp/deploy-secrets.env

          sshpass -e scp -o StrictHostKeyChecking=no \
            /tmp/deploy-secrets.env \
            docker-compose.deploy.yml \
            infra/nginx/nginx.conf \
            "${SSH_USER}@${SSH_HOST}:/tmp/"

          echo "=== SCP exit code: $? ==="

          echo "=== Files uploaded, executing deploy ==="
          # Execute deploy — all output goes to stdout (visible in GitHub Actions logs)
          # Using set -x to trace every command for debugging
          sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "${SSH_USER}@${SSH_HOST}" 'bash -s' << 'DEPLOY'
          set -x
          echo "[$(date)] Deploy started"

          cd /www/wwwroot/echolife || { echo "::error::FATAL: /www/wwwroot/echolife not found"; exit 1; }
          echo "Working dir: $(pwd)"

          # Verify uploaded files exist
          ls -la /tmp/deploy-secrets.env /tmp/docker-compose.deploy.yml /tmp/nginx.conf 2>&1 || {
            echo "::error::FATAL: Uploaded files missing in /tmp/"; exit 1
          }

          # Source and decode ACR credentials
          . /tmp/deploy-secrets.env || { echo "::error::FATAL: Cannot source deploy-secrets.env"; exit 1; }
          rm -f /tmp/deploy-secrets.env
          ACR_REGISTRY_VALUE=$(echo "$ACR_REGISTRY_B64" | base64 -d)
          ACR_NAMESPACE_VALUE=$(echo "$ACR_NAMESPACE_B64" | base64 -d)
          ACR_USERNAME_VALUE=$(echo "$ACR_USERNAME_B64" | base64 -d)
          ACR_PASSWORD_VALUE=$(echo "$ACR_PASSWORD_B64" | base64 -d)

          [ -z "$ACR_REGISTRY_VALUE" ] && { echo "::error::FATAL: ACR_REGISTRY empty after decode"; exit 1; }
          [ -z "$ACR_NAMESPACE_VALUE" ] && { echo "::error::FATAL: ACR_NAMESPACE empty after decode"; exit 1; }
          [ -z "$ACR_USERNAME_VALUE" ] && { echo "::error::FATAL: ACR_USERNAME empty after decode"; exit 1; }
          [ -z "$ACR_PASSWORD_VALUE" ] && { echo "::error::FATAL: ACR_PASSWORD empty after decode"; exit 1; }
          echo "ACR credentials decoded OK: registry=$ACR_REGISTRY_VALUE namespace=$ACR_NAMESPACE_VALUE"

          # Install config files
          cp /tmp/docker-compose.deploy.yml docker-compose.deploy.yml
          mkdir -p infra/nginx
          cp /tmp/nginx.conf infra/nginx/nginx.conf
          echo "Config files installed"

          # Update .env.production
          [ ! -f .env.production ] && { echo "::error::FATAL: .env.production not found"; exit 1; }
          sed -i "s|^ACR_REGISTRY=.*|ACR_REGISTRY=$ACR_REGISTRY_VALUE|" .env.production
          grep -q '^ACR_REGISTRY=' .env.production || echo "ACR_REGISTRY=$ACR_REGISTRY_VALUE" >> .env.production
          sed -i "s|^ACR_NAMESPACE=.*|ACR_NAMESPACE=$ACR_NAMESPACE_VALUE|" .env.production
          grep -q '^ACR_NAMESPACE=' .env.production || echo "ACR_NAMESPACE=$ACR_NAMESPACE_VALUE" >> .env.production
          grep -q '^NEXT_PUBLIC_API_URL=' .env.production || echo "NEXT_PUBLIC_API_URL=/api/v1" >> .env.production
          echo ".env.production updated"

          # Docker info
          docker --version
          docker compose version 2>&1 || docker-compose version 2>&1 || {
            echo "::error::FATAL: docker compose not available"; exit 1
          }

          # ACR login
          echo "$ACR_PASSWORD_VALUE" | docker login "$ACR_REGISTRY_VALUE" \
            -u "$ACR_USERNAME_VALUE" --password-stdin
          [ $? -ne 0 ] && { echo "::error::FATAL: docker login to ACR failed"; exit 1; }
          echo "Docker login OK"

          # Debug: show what compose thinks the image names are
          echo "=== .env.production ACR values ==="
          grep -E '^ACR_(REGISTRY|NAMESPACE)=' .env.production
          echo "=== Compose config (image names) ==="
          docker compose -f docker-compose.deploy.yml --env-file .env.production config 2>&1 | grep -E 'image:' || true

          # Try pulling each image individually with retry
          # Use SHORT_SHA tag to ensure we pull the EXACT image just built, not a stale :latest
          API_IMAGE_SHA="${ACR_REGISTRY_VALUE}/${ACR_NAMESPACE_VALUE}/echolife-api:${SHORT_SHA}"
          WEB_IMAGE_SHA="${ACR_REGISTRY_VALUE}/${ACR_NAMESPACE_VALUE}/echolife-web:${SHORT_SHA}"
          API_IMAGE="${ACR_REGISTRY_VALUE}/${ACR_NAMESPACE_VALUE}/echolife-api:latest"
          WEB_IMAGE="${ACR_REGISTRY_VALUE}/${ACR_NAMESPACE_VALUE}/echolife-web:latest"
          
          echo "=== Pulling images by SHA tag: $SHORT_SHA ==="
          echo "API SHA image: $API_IMAGE_SHA"
          echo "WEB SHA image: $WEB_IMAGE_SHA"
          
          # Check disk space first
          echo "=== Disk space BEFORE cleanup ==="
          df -h / /var 2>/dev/null || df -h /
          
          # Show docker info for debugging
          echo "=== Docker info ==="
          docker info 2>&1 | head -20

          # CRITICAL: Clean up old Docker images and build cache to free disk space
          # Use direct docker commands instead of docker-compose because
          # docker-compose stop/rm was silently failing, leaving old containers
          # and images that prevented the new image from being used.
          echo "=== Cleaning up old Docker resources ==="
          # Stop and remove old containers by name (not via docker-compose)
          docker stop echolife-api echolife-web 2>/dev/null || true
          docker rm -f echolife-api echolife-web 2>/dev/null || true
          # Verify containers are actually removed
          if docker ps -a --format '{{.Names}}' | grep -q 'echolife-api'; then
            echo "::error::FATAL: Cannot remove echolife-api container!"
            docker ps -a --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}' | grep echolife
            exit 1
          fi
          echo "Old containers removed ✓"
          
          # Remove ALL echolife-api and echolife-web images by any tag/ID
          docker images --format '{{.Repository}}:{{.Tag}} {{.ID}}' | grep -E 'echolife-(api|web)' | awk '{print $2}' | sort -u | xargs -r docker rmi -f 2>/dev/null || true
          # Also remove by full image name (in case grep missed due to long registry path)
          docker rmi "$API_IMAGE" 2>/dev/null || true
          docker rmi "$WEB_IMAGE" 2>/dev/null || true
          docker rmi "$API_IMAGE_SHA" 2>/dev/null || true
          docker rmi "$WEB_IMAGE_SHA" 2>/dev/null || true
          # CRITICAL: Only prune dangling images and build cache.
          # DO NOT use `docker image prune -af` — it deletes postgres/redis/nginx
          # base images, causing docker-compose up to fail when it can't pull them
          # fast enough (502 error).
          docker image prune -f 2>&1 || true
          docker container prune -f 2>&1 || true
          docker builder prune -af 2>&1 || true
          # DO NOT prune volumes — postgres_data and redis_data must be preserved
          
          echo "=== Disk space AFTER cleanup ==="
          df -h / /var 2>/dev/null || df -h /
          echo "=== Docker disk usage ==="
          docker system df 2>&1
          
          pull_with_retry() {
            local img="$1"
            local name="$2"
            for attempt in 1 2 3 4 5; do
              echo "=== Pull $name attempt $attempt/5: $img ==="
              local pull_output
              # Add 120s timeout per pull attempt
              pull_output=$(timeout 120 docker pull "$img" 2>&1) && {
                echo "$name pull OK"
                docker inspect --format='Created: {{.Created}}' "$img" 2>/dev/null || true
                return 0
              }
              local pull_exit=$?
              echo "Pull $name attempt $attempt FAILED (exit code: $pull_exit). Full output:"
              echo "$pull_output"
              # Emit full error as GitHub Actions annotation (truncated to ~200 chars for annotation)
              local err_summary
              err_summary=$(echo "$pull_output" | grep -iE 'error|fail|denied|not found|timeout|expired' | tail -3)
              if [ -n "$err_summary" ]; then
                echo "::error::Pull $name attempt $attempt (exit $pull_exit): $err_summary"
              else
                echo "::error::Pull $name attempt $attempt (exit $pull_exit). Last 10 lines of output:"
                echo "::error::$(echo "$pull_output" | tail -10 | tr '\n' ' ')"
              fi
              if [ "$attempt" -lt 5 ]; then
                echo "Retrying in 15s..."
                sleep 15
              fi
            done
            echo "::error::FATAL: cannot pull $img after 5 attempts"
            # Show docker daemon logs for debugging
            echo "=== Docker daemon logs (last 20 lines) ==="
            journalctl -u docker --no-pager -n 20 2>/dev/null || true
            return 1
          }
          
          pull_with_retry "$API_IMAGE_SHA" "API" || exit 1
          pull_with_retry "$WEB_IMAGE_SHA" "WEB" || exit 1
          echo "All images pulled OK (by SHA tag)"

          # CRITICAL: Verify the pulled SHA image has tracking module BEFORE tagging
          echo "=== Verifying pulled API image has tracking module ==="
          SHA_IMAGE_ID=$(docker inspect --format='{{.Id}}' "$API_IMAGE_SHA" 2>&1)
          echo "SHA image ID: $SHA_IMAGE_ID"
          docker run --rm "$API_IMAGE_SHA" ls /app/apps/api/dist/modules/tracking/ 2>&1 || {
            echo "::error::FATAL: Pulled SHA image does NOT have tracking module!"
            echo "::error::SHA image: $API_IMAGE_SHA"
            echo "::error::SHA image ID: $SHA_IMAGE_ID"
            # Check what modules ARE in the image
            MODULE_LIST=$(docker run --rm "$API_IMAGE_SHA" ls /app/apps/api/dist/modules/ 2>&1)
            echo "::error::Modules in SHA image: $(echo "$MODULE_LIST" | tr '\n' ' ')"
            # Check BUILD_MARKER
            docker run --rm "$API_IMAGE_SHA" cat /app/apps/api/dist/BUILD_MARKER.txt 2>&1 || echo "::error::No BUILD_MARKER in SHA image"
            exit 1
          }
          echo "Tracking module verified in pulled SHA image ✓"
          docker run --rm "$API_IMAGE_SHA" cat /app/apps/api/dist/BUILD_MARKER.txt 2>&1 || true

          # Tag SHA images as :latest so docker-compose can use them
          echo "=== Tagging SHA images as :latest ==="
          # Tag with the name from secrets (what we've been using)
          docker tag "$API_IMAGE_SHA" "$API_IMAGE" || { echo "::error::FATAL: cannot tag API image"; exit 1; }
          docker tag "$WEB_IMAGE_SHA" "$WEB_IMAGE" || { echo "::error::FATAL: cannot tag WEB image"; exit 1; }
          
          # ALSO tag with the name from .env.production (what docker-compose actually uses)
          # This handles cases where .env.production values differ from secrets
          ENV_ACR_REGISTRY=$(grep '^ACR_REGISTRY=' .env.production | head -1 | cut -d= -f2-)
          ENV_ACR_NAMESPACE=$(grep '^ACR_NAMESPACE=' .env.production | head -1 | cut -d= -f2-)
          ENV_API_IMAGE="${ENV_ACR_REGISTRY}/${ENV_ACR_NAMESPACE}/echolife-api:latest"
          ENV_WEB_IMAGE="${ENV_ACR_REGISTRY}/${ENV_ACR_NAMESPACE}/echolife-web:latest"
          echo "Secrets API image:  $API_IMAGE"
          echo "EnvFile API image:  $ENV_API_IMAGE"
          if [ "$ENV_API_IMAGE" != "$API_IMAGE" ]; then
            echo "WARNING: .env.production image name differs from secrets! Tagging both."
            echo "::error::WARNING: EnvFile image: $ENV_API_IMAGE"
            docker tag "$API_IMAGE_SHA" "$ENV_API_IMAGE" || { echo "::error::FATAL: cannot tag API image (env)"; exit 1; }
            docker tag "$WEB_IMAGE_SHA" "$ENV_WEB_IMAGE" || { echo "::error::FATAL: cannot tag WEB image (env)"; exit 1; }
          fi
          echo "Images tagged OK"

          # Print image digests to verify we got the new images
          echo "=== Image digests ==="
          LATEST_IMAGE_ID=$(docker inspect --format='{{.Id}}' "$API_IMAGE" 2>&1)
          echo "API latest image ID: $LATEST_IMAGE_ID"
          echo "API SHA image ID:    $SHA_IMAGE_ID"
          if [ "$SHA_IMAGE_ID" != "$LATEST_IMAGE_ID" ]; then
            echo "::error::FATAL: SHA image ID != latest image ID after tag!"
            echo "::error::SHA: $SHA_IMAGE_ID"
            echo "::error::Latest: $LATEST_IMAGE_ID"
            exit 1
          fi
          echo "Image IDs match ✓"
          docker inspect --format='API image: {{.Id}} Created: {{.Created}}' "$API_IMAGE" 2>&1
          docker inspect --format='WEB image: {{.Id}} Created: {{.Created}}' "$WEB_IMAGE" 2>&1
          API_CREATED=$(docker inspect --format='{{.Created}}' "$API_IMAGE" 2>&1)
          echo "::error::API image created: $API_CREATED (expect today's date)"

          # Start DB/Redis (if not already running)
          echo "=== Starting PostgreSQL and Redis ==="
          docker compose -f docker-compose.deploy.yml --env-file .env.production up -d postgres redis 2>&1 || {
            echo "::error::FATAL: Cannot start postgres/redis!"
            docker ps -a | grep echolife
            exit 1
          }
          echo "DB/Redis starting..."
          sleep 8

          # Check Postgres health
          DB_STATUS=$(docker inspect --format='{{.State.Health.Status}}' echolife-postgres 2>/dev/null)
          echo "Postgres health: $DB_STATUS"
          if [ "$DB_STATUS" != "healthy" ]; then
            echo "WARNING: Postgres not healthy, showing logs..."
            docker logs echolife-postgres --tail 20
            sleep 15
            DB_STATUS=$(docker inspect --format='{{.State.Health.Status}}' echolife-postgres 2>/dev/null)
            echo "Postgres health after wait: $DB_STATUS"
          fi

          # Check Redis health (api depends on BOTH being healthy)
          REDIS_STATUS=$(docker inspect --format='{{.State.Health.Status}}' echolife-redis 2>/dev/null)
          echo "Redis health: $REDIS_STATUS"
          if [ "$REDIS_STATUS" != "healthy" ]; then
            echo "WARNING: Redis not healthy, showing logs..."
            docker logs echolife-redis --tail 20
            sleep 10
            REDIS_STATUS=$(docker inspect --format='{{.State.Health.Status}}' echolife-redis 2>/dev/null)
            echo "Redis health after wait: $REDIS_STATUS"
          fi

          # Validate compose config before starting API
          echo "=== Validating docker-compose config ==="
          COMPOSE_CONFIG_OUTPUT=$(docker compose -f docker-compose.deploy.yml --env-file .env.production config 2>&1)
          COMPOSE_CONFIG_EXIT=$?
          if [ $COMPOSE_CONFIG_EXIT -ne 0 ]; then
            echo "::error::FATAL: docker-compose config validation failed (exit $COMPOSE_CONFIG_EXIT)!"
            echo "::error::$(echo "$COMPOSE_CONFIG_OUTPUT" | tail -10 | tr '\n' '|')"
            # Show which env vars are missing
            echo "=== .env.production keys ==="
            cut -d= -f1 .env.production | sort
            exit 1
          fi
          echo "Compose config valid ✓"
          echo "Image names in config:"
          echo "$COMPOSE_CONFIG_OUTPUT" | grep -E 'image:'

          # Start API
          echo "=== Local echolife images ==="
          docker images | grep echolife || echo "No echolife images found!"
          
          echo "=== Starting API via docker compose (attempt 1: --pull never) ==="
          API_OUTPUT=$(docker compose -f docker-compose.deploy.yml --env-file .env.production up -d --force-recreate --pull never api 2>&1)
          API_EXIT=$?
          echo "Exit code: $API_EXIT"
          echo "Output: $API_OUTPUT"
          
          if [ $API_EXIT -ne 0 ]; then
            echo "::error::docker compose up (--pull never) failed (exit $API_EXIT)"
            echo "=== Trying without --pull never (attempt 2) ==="
            API_OUTPUT2=$(docker compose -f docker-compose.deploy.yml --env-file .env.production up -d --force-recreate api 2>&1)
            API_EXIT2=$?
            echo "Exit code: $API_EXIT2"
            echo "Output: $API_OUTPUT2"
            
            if [ $API_EXIT2 -ne 0 ]; then
              echo "::error::docker compose up failed both times (last exit $API_EXIT2)"
              echo "::error::Output: $(echo "$API_OUTPUT2" | tail -5 | tr '\n' '|')"
              echo "=== Falling back to docker run ==="
              
              # Find the compose network name
              NETWORK=$(docker network ls --format '{{.Name}}' | grep -E 'echolife.*backend|backend' | head -1)
              if [ -z "$NETWORK" ]; then
                echo "Creating backend network..."
                NETWORK="echolife_backend"
                docker network create "$NETWORK" 2>/dev/null || true
              fi
              echo "Using network: $NETWORK"
              
              # Connect postgres and redis to this network if not already
              docker network connect "$NETWORK" echolife-postgres 2>/dev/null || true
              docker network connect "$NETWORK" echolife-redis 2>/dev/null || true
              
              # Run API container directly with --env-file
              docker run -d \
                --name echolife-api \
                --restart unless-stopped \
                --network "$NETWORK" \
                --network-alias api \
                --env-file .env.production \
                -e NODE_ENV=production \
                -e "DATABASE_URL=postgresql://$(grep '^POSTGRES_USER=' .env.production | cut -d= -f2-):$(grep '^POSTGRES_PASSWORD=' .env.production | cut -d= -f2-)@postgres:5432/$(grep '^POSTGRES_DB=' .env.production | cut -d= -f2-)?schema=public" \
                -e "REDIS_URL=redis://:$(grep '^REDIS_PASSWORD=' .env.production | cut -d= -f2-)@redis:6379" \
                --health-cmd="wget --no-verbose --tries=1 --spider http://localhost:3001/api/v1/health || exit 1" \
                --health-interval=30s \
                --health-timeout=10s \
                --health-retries=5 \
                --health-start-period=120s \
                --memory=1g \
                --cpus=1.0 \
                "$API_IMAGE" 2>&1 || {
                  echo "::error::FATAL: docker run also failed!"
                  docker logs echolife-api 2>&1 || true
                  exit 1
                }
              echo "API started via docker run fallback ✓"
              # Mark that we used docker run (web/nginx need --no-deps)
              USED_DOCKER_RUN=1
            else
              USED_DOCKER_RUN=0
            fi
          else
            USED_DOCKER_RUN=0
          fi
          echo "API starting..."
          docker ps -a --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}' | grep echolife

          # Wait for API health — reduced from 300s to 120s for faster feedback
          for i in $(seq 1 24); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' echolife-api 2>/dev/null)
            CONTAINER_STATE=$(docker inspect --format='{{.State.Status}}' echolife-api 2>/dev/null)
            RESTART_COUNT=$(docker inspect --format='{{.RestartCount}}' echolife-api 2>/dev/null)
            
            if [ "$STATUS" = "healthy" ]; then
              echo "API healthy after $((i*5))s"
              break
            fi
            
            # Early exit: if container has exited or is in a restart loop, show logs immediately
            if [ "$CONTAINER_STATE" = "exited" ] || [ "$CONTAINER_STATE" = "dead" ]; then
              echo "::error::FATAL: API container has exited! State: $CONTAINER_STATE"
              echo "::error::Container exit code: $(docker inspect --format='{{.State.ExitCode}}' echolife-api 2>/dev/null)"
              echo "::error::OOM killed: $(docker inspect --format='{{.State.OOMKilled}}' echolife-api 2>/dev/null)"
              echo "::error::Error: $(docker inspect --format='{{.State.Error}}' echolife-api 2>/dev/null)"
              API_LOGS=$(docker logs echolife-api 2>&1 | tail -50)
              echo "::error::API logs (last 50 lines): $(echo "$API_LOGS" | tr '\n' '|')"
              exit 1
            fi
            
            # If restart count is high, the container is crash-looping
            if [ "$RESTART_COUNT" -gt 3 ] 2>/dev/null; then
              echo "::error::FATAL: API container is crash-looping (restart count: $RESTART_COUNT)!"
              API_LOGS=$(docker logs echolife-api 2>&1 | tail -50)
              echo "::error::API logs (last 50 lines): $(echo "$API_LOGS" | tr '\n' '|')"
              exit 1
            fi
            
            # At 30s, show a quick log snapshot for debugging
            if [ "$i" -eq 6 ]; then
              echo "=== API logs snapshot at 30s ==="
              docker logs echolife-api --tail 30 2>&1
              echo "=== Container state: $CONTAINER_STATE, Health: $STATUS, Restarts: $RESTART_COUNT ==="
            fi
            
            [ "$i" -eq 24 ] && { 
              echo "::error::FATAL: API not healthy after 120s"
              echo "::error::Container state: $CONTAINER_STATE, Health: $STATUS, Restarts: $RESTART_COUNT"
              echo "=== Full API logs (last 200 lines) ==="
              docker logs echolife-api --tail 200 2>&1
              echo "=== Container inspect ==="
              docker inspect echolife-api 2>&1 | grep -A5 '"State"' | head -20
              # Emit key log lines as annotations for visibility
              API_LOG_LINES=$(docker logs echolife-api 2>&1 | grep -iE 'error|fatal|fail|exception|crash|EADDR|ECONN|MODULE_NOT_FOUND|cannot find' | tail -10)
              if [ -n "$API_LOG_LINES" ]; then
                echo "::error::Key error lines from API logs:"
                echo "$API_LOG_LINES" | while IFS= read -r line; do
                  echo "::error::$line"
                done
              fi
              exit 1
            }
            sleep 5
          done

          # Verify the running container uses the freshly pulled image
          echo "=== Container image verification ==="
          docker inspect --format='Container image: {{.Image}}' echolife-api 2>&1
          docker inspect --format='Image ID from pull: {{.Id}}' "$API_IMAGE" 2>&1

          # Show API startup logs (check for TrackingModule)
          echo "=== API startup logs (last 120 lines) ==="
          docker logs echolife-api --tail 120 2>&1
          echo "=== End API logs ==="

          # Check if tracking module compiled files exist in the container
          echo "=== Checking tracking module in container ==="
          docker exec echolife-api ls -la /app/apps/api/dist/modules/tracking/ 2>&1 || echo "WARNING: tracking module dist not found"
          docker exec echolife-api cat /app/apps/api/dist/modules/tracking/tracking.module.js 2>&1 | head -5 || echo "WARNING: tracking.module.js not found"
          docker exec echolife-api cat /app/apps/api/dist/modules/tracking/tracking.controller.js 2>&1 | head -10 || echo "WARNING: tracking.controller.js not found"
          echo "=== Checking TrackingModule in app.module.js ==="
          docker exec echolife-api grep -c "TrackingModule" /app/apps/api/dist/app.module.js 2>&1 || echo "TrackingModule not found in app.module.js"

          # Restart Web + Nginx
          if [ "$USED_DOCKER_RUN" = "1" ]; then
            echo "=== Starting Web + Nginx with --no-deps (API was started via docker run) ==="
            docker compose -f docker-compose.deploy.yml --env-file .env.production up -d --force-recreate --no-deps web nginx 2>&1 || {
              echo "::error::docker compose up web/nginx failed!"
              echo "::error::Trying docker run for web..."
              FRONTEND_NETWORK=$(docker network ls --format '{{.Name}}' | grep -E 'echolife.*frontend|frontend' | head -1)
              BACKEND_NETWORK=$(docker network ls --format '{{.Name}}' | grep -E 'echolife.*backend|backend' | head -1)
              docker run -d \
                --name echolife-web \
                --restart unless-stopped \
                --network "$FRONTEND_NETWORK" \
                --network-alias web \
                --env-file .env.production \
                -e NODE_ENV=production \
                -e "API_INTERNAL_URL=http://api:3001" \
                --health-cmd="wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1" \
                --health-interval=30s \
                --health-timeout=10s \
                --health-retries=3 \
                --health-start-period=40s \
                --memory=256m \
                "$WEB_IMAGE" 2>&1 || { echo "::error::FATAL: docker run web failed!"; exit 1; }
              docker network connect "$BACKEND_NETWORK" echolife-web 2>/dev/null || true
              # Start nginx via docker run too
              docker run -d \
                --name echolife-nginx \
                --restart unless-stopped \
                --network "$FRONTEND_NETWORK" \
                --network-alias nginx \
                -p 80:80 -p 443:443 \
                -v /www/wwwroot/echolife/infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro \
                -v /www/wwwroot/echolife/infra/nginx/ssl:/etc/nginx/ssl:ro \
                --memory=64m \
                nginx:alpine 2>&1 || { echo "::error::FATAL: docker run nginx failed!"; exit 1; }
              docker network connect "$BACKEND_NETWORK" echolife-nginx 2>/dev/null || true
            }
          else
            echo "=== Starting Web + Nginx via docker compose ==="
            docker compose -f docker-compose.deploy.yml --env-file .env.production up -d --force-recreate web nginx 2>&1 || {
              echo "::error::docker compose up web/nginx failed, retrying with --no-deps..."
              docker compose -f docker-compose.deploy.yml --env-file .env.production up -d --force-recreate --no-deps web nginx 2>&1 || {
                echo "::error::FATAL: Cannot start web/nginx!"
                exit 1
              }
            }
          fi
          echo "Web/Nginx started"
          sleep 5

          # HTTP health check
          echo "=== Health check ==="
          curl -fsS http://localhost/api/v1/health && echo "" || echo "WARNING: HTTP health check failed"

          # Smoke test: tracking endpoint — POST events (public)
          echo "=== Tracking endpoint test (POST /events) ==="
          TRACKING_RESP=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X POST http://localhost/api/v1/tracking/events \
            -H 'Content-Type: application/json' \
            -d '{"sessionId":"deploy-smoke","eventType":"page_view","pagePath":"/deploy-smoke","pageTitle":"Deploy Smoke Test"}')
          echo "Tracking POST response: $TRACKING_RESP"

          # Also test GET /overview — should return 401 (route exists, auth required), NOT 404
          echo "=== Tracking endpoint test (GET /overview) ==="
          OVERVIEW_RESP=$(curl -s -w "\nHTTP_CODE:%{http_code}" http://localhost/api/v1/tracking/overview)
          echo "Tracking GET /overview response: $OVERVIEW_RESP"

          TRACKING_CODE=$(echo "$TRACKING_RESP" | grep -o 'HTTP_CODE:[0-9]*' | cut -d: -f2)
          OVERVIEW_CODE=$(echo "$OVERVIEW_RESP" | grep -o 'HTTP_CODE:[0-9]*' | cut -d: -f2)

          if [ "$TRACKING_CODE" = "404" ] || [ "$OVERVIEW_CODE" = "404" ]; then
            echo "::error::FATAL: Tracking endpoint returned 404 — TrackingModule not loaded!"
            # Check BUILD_MARKER to verify image identity
            BUILD_MARKER=$(docker exec echolife-api cat /app/apps/api/dist/BUILD_MARKER.txt 2>&1 || echo "NO BUILD MARKER")
            echo "::error::Build marker: $BUILD_MARKER (expected SHA: $SHORT_SHA)"
            # Check dist modules directory listing
            DIST_DIRS=$(docker exec echolife-api ls /app/apps/api/dist/modules/ 2>&1 || echo "NO MODULES DIR")
            echo "::error::dist/modules/ dirs: $(echo "$DIST_DIRS" | tr '\n' ' ')"
            # Emit ALL diagnostics as error annotations for visibility
            DIST_FILES=$(docker exec echolife-api find /app/apps/api/dist/modules/tracking -type f 2>&1 || echo "NO TRACKING DIST FOUND")
            echo "::error::Tracking dist files: $(echo "$DIST_FILES" | tr '\n' ' ')"
            
            APP_MODULE_TRACKING=$(docker exec echolife-api grep -c "TrackingModule" /app/apps/api/dist/app.module.js 2>&1 || echo "0")
            echo "::error::TrackingModule count in app.module.js: $APP_MODULE_TRACKING"
            
            APP_MODULE_CONTENT=$(docker exec echolife-api cat /app/apps/api/dist/app.module.js 2>&1 | tail -30)
            echo "::error::app.module.js (last 30 lines): $(echo "$APP_MODULE_CONTENT" | tr '\n' '|')"
            
            TRACKING_MODULE_JS=$(docker exec echolife-api cat /app/apps/api/dist/modules/tracking/tracking.module.js 2>&1 || echo "FILE NOT FOUND")
            echo "::error::tracking.module.js: $(echo "$TRACKING_MODULE_JS" | tr '\n' '|')"
            
            TRACKING_CONTROLLER_JS=$(docker exec echolife-api cat /app/apps/api/dist/modules/tracking/tracking.controller.js 2>&1 | head -20 || echo "FILE NOT FOUND")
            echo "::error::tracking.controller.js (first 20 lines): $(echo "$TRACKING_CONTROLLER_JS" | tr '\n' '|')"
            
            API_LOGS=$(docker logs echolife-api 2>&1 | tail -50)
            echo "::error::API logs (last 50 lines): $(echo "$API_LOGS" | tr '\n' '|')"
            
            PRISMA_CHECK=$(docker exec echolife-api node -e "try{const {PrismaClient}=require('@prisma/client'); const p=new PrismaClient(); console.log('trackingEvent ' + ('trackingEvent' in p ? 'EXISTS' : 'MISSING')); p.\$disconnect().catch(()=>{});}catch(e){console.log('PRISMA ERROR: '+e.message)}" 2>&1 || echo "CHECK FAILED")
            echo "::error::Prisma client check: $PRISMA_CHECK"
            
            # Also check what routes ARE registered
            ROUTES_CHECK=$(docker exec echolife-api node -e "try{const m=require('/app/apps/api/dist/app.module.js'); console.log(Object.keys(m).join(','))}catch(e){console.log('MODULE LOAD ERROR: '+e.message)}" 2>&1 || echo "CHECK FAILED")
            echo "::error::app.module exports: $ROUTES_CHECK"
            
            # Check container image creation time
            IMAGE_TIME=$(docker inspect --format='{{.Created}}' echolife-api 2>&1)
            echo "::error::Container image created: $IMAGE_TIME"
            
            exit 1
          elif [ "$TRACKING_CODE" = "200" ] || [ "$TRACKING_CODE" = "201" ]; then
            echo "Tracking endpoint OK!"
          fi

          echo "Container status:"
          docker ps -a --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}' | grep -E 'echolife|NAMES'
          echo "[$(date)] Deploy completed"
          DEPLOY
