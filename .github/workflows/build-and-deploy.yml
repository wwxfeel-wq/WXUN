name: Build & Deploy to Aliyun

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  ACR_REGISTRY: crpi-2ybx9wocff19tlzj.cn-hangzhou.personal.cr.aliyuncs.com
  ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
  IMAGE_WEB: echolife-web
  IMAGE_API: echolife-api

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      short_sha: ${{ steps.meta.outputs.short_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Meta
        id: meta
        run: |
          echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & push echolife-web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.web
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_WEB }}:latest
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_WEB }}:${{ steps.meta.outputs.short_sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Build & push echolife-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.api
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_API }}:latest
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_API }}:${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  deploy:
    name: Deploy to Aliyun ECS
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script: |
            set -e
            cd /www/wwwroot/echolife
            echo "== 同步配置文件 =="
            git pull origin main
            echo "== 登录 ACR =="
            echo "${{ secrets.ACR_PASSWORD }}" | docker login \
              ${{ env.ACR_REGISTRY }} \
              -u "${{ secrets.ACR_USERNAME }}" --password-stdin
            echo "== 拉取新镜像 =="
            docker compose -f docker-compose.deploy.yml --env-file .env.production pull web api
            echo "== 重启服务 =="
            docker compose -f docker-compose.deploy.yml --env-file .env.production up -d
            echo "== 清理旧镜像 =="
            docker image prune -f
            echo "== 完成 =="
            docker compose -f docker-compose.deploy.yml --env-file .env.production ps
