name: Build & Deploy to Aliyun

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  ACR_REGISTRY: crpi-2ybx9wocff19tlzj.cn-hangzhou.personal.cr.aliyuncs.com
  ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
  IMAGE_WEB: echolife-web
  IMAGE_API: echolife-api

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Meta
        id: meta
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & push echolife-web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.web
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_WEB }}:latest
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_WEB }}:${{ steps.meta.outputs.short_sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Build & push echolife-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.api
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_API }}:latest
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_API }}:${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  deploy:
    name: Deploy to Aliyun ECS
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare deployment files
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          ACR_NAMESPACE_VALUE: ${{ secrets.ACR_NAMESPACE }}
        run: |
          set -euo pipefail
          printf 'ACR_REGISTRY_B64=%s\n' "$(printf '%s' "$ACR_REGISTRY" | base64 -w0)" > /tmp/deploy-secrets.env
          printf 'ACR_NAMESPACE_B64=%s\n' "$(printf '%s' "$ACR_NAMESPACE_VALUE" | base64 -w0)" >> /tmp/deploy-secrets.env
          printf 'ACR_USERNAME_B64=%s\n' "$(printf '%s' "$ACR_USERNAME" | base64 -w0)" >> /tmp/deploy-secrets.env
          printf 'ACR_PASSWORD_B64=%s\n' "$(printf '%s' "$ACR_PASSWORD" | base64 -w0)" >> /tmp/deploy-secrets.env
          test -s /tmp/deploy-secrets.env

      - name: Upload deployment files
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          test -n "$SSHPASS"
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 \
            "${SSH_USER}@${SSH_HOST}" 'echo SSH_OK'
          sshpass -e scp -o StrictHostKeyChecking=no \
            docker-compose.deploy.yml "${SSH_USER}@${SSH_HOST}:/tmp/docker-compose.deploy.yml"
          sshpass -e scp -o StrictHostKeyChecking=no \
            infra/nginx/nginx.conf "${SSH_USER}@${SSH_HOST}:/tmp/nginx.conf"
          sshpass -e scp -o StrictHostKeyChecking=no \
            /tmp/deploy-secrets.env "${SSH_USER}@${SSH_HOST}:/tmp/deploy-secrets.env"

      - name: Pull images and restart services
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 \
            "${SSH_USER}@${SSH_HOST}" 'bash -se' <<'REMOTE_SCRIPT'
          cd /www/wwwroot/echolife
          test -f .env.production
          test -s /tmp/deploy-secrets.env

          get_secret() {
            sed -n "s/^$1=//p" /tmp/deploy-secrets.env | base64 -d
          }

          ACR_REGISTRY_VALUE="$(get_secret ACR_REGISTRY_B64)"
          ACR_NAMESPACE_VALUE="$(get_secret ACR_NAMESPACE_B64)"
          ACR_USERNAME_VALUE="$(get_secret ACR_USERNAME_B64)"
          ACR_PASSWORD_VALUE="$(get_secret ACR_PASSWORD_B64)"
          rm -f /tmp/deploy-secrets.env

          test -n "$ACR_REGISTRY_VALUE"
          test -n "$ACR_NAMESPACE_VALUE"
          test -n "$ACR_USERNAME_VALUE"
          test -n "$ACR_PASSWORD_VALUE"

          install -m 0644 /tmp/docker-compose.deploy.yml docker-compose.deploy.yml
          install -m 0644 /tmp/nginx.conf infra/nginx/nginx.conf

          if grep -q '^ACR_REGISTRY=' .env.production; then
            sed -i "s|^ACR_REGISTRY=.*|ACR_REGISTRY=${ACR_REGISTRY_VALUE}|" .env.production
          else
            printf 'ACR_REGISTRY=%s\n' "$ACR_REGISTRY_VALUE" >> .env.production
          fi
          if grep -q '^ACR_NAMESPACE=' .env.production; then
            sed -i "s|^ACR_NAMESPACE=.*|ACR_NAMESPACE=${ACR_NAMESPACE_VALUE}|" .env.production
          else
            printf 'ACR_NAMESPACE=%s\n' "$ACR_NAMESPACE_VALUE" >> .env.production
          fi
          grep -q '^NEXT_PUBLIC_API_URL=' .env.production || printf 'NEXT_PUBLIC_API_URL=/api/v1\n' >> .env.production

          printf '%s' "$ACR_PASSWORD_VALUE" | docker login "$ACR_REGISTRY_VALUE" \
            -u "$ACR_USERNAME_VALUE" --password-stdin

          docker compose -f docker-compose.deploy.yml --env-file .env.production config --quiet
          docker compose -f docker-compose.deploy.yml --env-file .env.production pull web api
          docker compose -f docker-compose.deploy.yml --env-file .env.production up -d postgres redis
          docker compose -f docker-compose.deploy.yml --env-file .env.production up -d --force-recreate api

          for i in $(seq 1 30); do
            if docker inspect --format='{{.State.Health.Status}}' echolife-api 2>/dev/null | grep -q '^healthy$'; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              docker logs echolife-api --tail 100
              exit 1
            fi
            sleep 5
          done

          docker compose -f docker-compose.deploy.yml --env-file .env.production up -d --force-recreate web nginx

          for i in $(seq 1 18); do
            if curl -fsS http://localhost/api/v1/health >/tmp/health.json; then
              break
            fi
            if [ "$i" -eq 18 ]; then
              docker compose -f docker-compose.deploy.yml --env-file .env.production ps
              docker logs echolife-api --tail 100
              exit 1
            fi
            sleep 5
          done

          curl -fsS -X POST http://localhost/api/v1/tracking/events \
            -H 'Content-Type: application/json' \
            --data '{"sessionId":"deployment-smoke-test","eventType":"page_view","pagePath":"/deployment-smoke-test","pageTitle":"Deployment Smoke Test"}'

          {
            cat /tmp/health.json
            echo
            docker compose -f docker-compose.deploy.yml --env-file .env.production ps
            docker logs echolife-api --tail 30
          } >/tmp/deploy_diag.txt 2>&1
          REMOTE_SCRIPT

      - name: Download diagnostic
        if: always()
        continue-on-error: true
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          sudo apt-get install -y -qq sshpass
          sshpass -e scp -o StrictHostKeyChecking=no \
            "${SSH_USER}@${SSH_HOST}:/tmp/deploy_diag.txt" deploy_diag.txt || true

      - name: Upload diagnostic artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: deploy-diagnostic
          path: deploy_diag.txt
          retention-days: 7
          if-no-files-found: ignore
