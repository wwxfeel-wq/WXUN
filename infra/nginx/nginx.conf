worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
    '$status $body_bytes_sent "$http_referer" '
    '"$http_user_agent" "$http_x_forwarded_for"';
  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  client_max_body_size 10m;

  # Gzip
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

  # Rate limiting
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;

  # Proxy cache for API responses
  proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m max_size=100m inactive=60m use_temp_path=off;

  # Upstreams
  upstream web_backend {
    server web:3000;
  }
  upstream api_backend {
    server api:3001;
  }
  # NOTE: openclaw_backend removed — openclaw container uses profiles and may
  # not be running, which causes nginx to fail on DNS resolution at startup.

  # ============================================================
  # HTTP server — 重定向到 HTTPS
  # ============================================================
  # Let's Encrypt ACME challenge 通过 HTTP 可访问，其余请求重定向到 HTTPS。
  server {
    listen 80;
    server_name _;

    # Let's Encrypt ACME challenge — 通过 HTTP 可访问，不重定向
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    # HTTP → HTTPS 重定向（需在安装 SSL 证书并启用 HTTPS server 块后取消注释）
    # if ($request_uri !~ ^/.well-known/acme-challenge/) {
    #   return 301 https://$host$request_uri;
    # }

    # Security headers (no HSTS — self-signed cert would lock browsers to broken HTTPS)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP: 移除 'unsafe-eval' 以增强安全性，仅保留 'unsafe-inline'（Next.js 需要）
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self'; object-src 'none'; frame-src 'none';" always;
    add_header X-DNS-Prefetch-Control "on" always;

    # Static assets caching (Next.js _next/static)
    location /_next/static/ {
      proxy_pass http://web_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_cache_valid 200 1y;
      add_header Cache-Control "public, max-age=31536000, immutable";
      access_log off;
    }

    # OpenClaw 网关 — 暂时禁用（openclaw容器使用profiles隔离，未运行时nginx无法解析）
    # location /openclaw/ {
    #   proxy_pass http://openclaw_backend/;
    #   proxy_http_version 1.1;
    #   proxy_set_header Host $host;
    #   proxy_set_header X-Real-IP $remote_addr;
    #   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #   proxy_set_header X-Forwarded-Proto $scheme;
    #   proxy_read_timeout 120s;
    # }

    # SSE streaming endpoints — 专用 location 确保 SSE 不被缓冲
    location ~ ^/api/v1/ai/(chat|digital-life)$ {
      limit_req zone=api_limit burst=20 nodelay;

      proxy_pass http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # 关键：禁用所有缓冲，确保 SSE 实时推送
      proxy_set_header Connection '';
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      chunked_transfer_encoding on;
      # 明确告知上游和客户端不缓冲
      add_header X-Accel-Buffering no;
    }

    # API routes
    location /api/ {
      limit_req zone=api_limit burst=20 nodelay;

      proxy_pass http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # SSE support
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      chunked_transfer_encoding on;
    }

    # Block Swagger in production
    location /api/docs {
      deny all;
      return 404;
    }

    # Health check (nginx layer)
    location /health {
      access_log off;
      return 200 'ok';
      add_header Content-Type text/plain;
    }

    # WebSocket support
    location /ws {
      proxy_pass http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend (Next.js)
    location / {
      limit_req zone=general burst=30 nodelay;

      proxy_pass http://web_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # 覆盖 Next.js 的 s-maxage=31536000：先隐藏上游的 Cache-Control，
      # 再强制添加 no-cache。避免新旧 Cache-Control 并存导致浏览器歧义。
      proxy_hide_header Cache-Control;
      proxy_hide_header Expires;
      add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
      add_header Pragma "no-cache" always;
      expires off;
    }
  }

