# ===== 服务器部署专用 compose =====
# 与 docker-compose.yml 的区别：web/api 使用 image: 从 ACR 拉取现成镜像，
# 不在服务器本地 build，避免服务器内存不足导致构建失败（OOM）。
# 镜像由 GitHub Actions 在 .github/workflows/build-and-deploy.yml 中构建并推送到 ACR。
#
# 用法（服务器上执行）：
#   docker login <ACR_REGISTRY> -u <username> -p <password>
#   docker compose -f docker-compose.deploy.yml --env-file .env.production pull
#   docker compose -f docker-compose.deploy.yml --env-file .env.production up -d

services:
  # ===== PostgreSQL with pgvector =====
  # TODO: pgvector extension is available but not currently used.
  # See MemoryEmbedding model in schema.prisma for migration plan.
  postgres:
    image: pgvector/pgvector:pg16
    container_name: echolife-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-echolife}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-echolife}
    expose:
      - '5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-echolife}']
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'
    networks:
      - backend

  # ===== Redis (with password) =====
  # NOTE (R3-DOCKER-009): Redis password is passed via --requirepass on the command
  # line, which makes it visible in the process list (ps). This is acceptable for
  # now because the container network is isolated. For stronger security, use
  # redis.conf mounted as a volume or Redis ACL files.
  redis:
    image: redis:7-alpine
    container_name: echolife-redis
    restart: unless-stopped
    expose:
      - '6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping']
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.3'
    networks:
      - backend

  # ===== Backend API (image from ACR) =====
  api:
    image: ${ACR_REGISTRY}/${ACR_NAMESPACE}/echolife-api:latest
    container_name: echolife-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-echolife}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-echolife}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      AI_ACTIVE_PROVIDER: ${AI_ACTIVE_PROVIDER:-deepseek}
      GLM_API_KEY: ${GLM_API_KEY}
      GLM_API_URL: ${GLM_API_URL:-https://open.bigmodel.cn/api/paas/v4}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_API_URL: ${DEEPSEEK_API_URL:-https://api.deepseek.com/v1}
      CORS_ORIGINS: ${CORS_ORIGINS}
      # SECURITY: OPENCLAW_WEBHOOK_SECRET 必须在 .env.production 或 GitHub Secrets 中设置。
      OPENCLAW_WEBHOOK_SECRET: ${OPENCLAW_WEBHOOK_SECRET:?OPENCLAW_WEBHOOK_SECRET is required}
      # IoT (Mi Home) - optional, from GitHub Secrets
      MIHOME_CLIENT_ID: ${MIHOME_CLIENT_ID:-}
      MIHOME_CLIENT_SECRET: ${MIHOME_CLIENT_SECRET:-}
      # Puppeteer screenshot support
      PUPPETEER_EXECUTABLE_PATH: ${PUPPETEER_EXECUTABLE_PATH:-/usr/bin/chromium}
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: ${PUPPETEER_SKIP_CHROMIUM_DOWNLOAD:-true}
    expose:
      - '3001'
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3001/api/v1/health']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          # R3-DOCKER-008: 1g for NestJS + Chromium (Puppeteer screenshot support)
          memory: 1g
          cpus: '1.0'
    networks:
      - backend

  # ===== Frontend Web (image from ACR) =====
  web:
    image: ${ACR_REGISTRY}/${ACR_NAMESPACE}/echolife-web:latest
    container_name: echolife-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      API_INTERNAL_URL: http://api:3001
    expose:
      - '3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'
    networks:
      - frontend
      - backend

  # ===== OpenClaw Gateway (微信 ClawBot) =====
  # OpenClaw 运行微信 ClawBot 插件，负责：
  #   - 扫码登录 (QR code)
  #   - iLink 协议 (消息收发)
  #   - 消息路由到 EchoLife API webhook
  # NOTE: 使用 profiles 避免在服务器上本地构建（2vCPU/4GiB 会 OOM）
  # 需要时手动启动: docker compose --profile openclaw up -d openclaw
  openclaw:
    profiles: ['openclaw']
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.openclaw
    container_name: echolife-openclaw
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # SECURITY: OPENCLAW_WEBHOOK_SECRET 必须在 .env.production 或 GitHub Secrets 中设置。
      OPENCLAW_WEBHOOK_SECRET: ${OPENCLAW_WEBHOOK_SECRET:?OPENCLAW_WEBHOOK_SECRET is required}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_API_URL: ${DEEPSEEK_API_URL:-https://api.deepseek.com/v1}
    expose:
      - '5140'
    volumes:
      - openclaw_data:/data/openclaw
      - ./infra/openclaw/config.yaml:/app/config.yaml:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'
    networks:
      - backend

  # ===== Nginx Reverse Proxy =====
  nginx:
    image: nginx:alpine
    container_name: echolife-nginx
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: '0.2'
    networks:
      - frontend
      - backend

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  nginx_cache:
  openclaw_data:
